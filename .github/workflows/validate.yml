name: validate-registry

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registry invariants
        run: python3 scripts/validate_registry.py
      - name: Smoke-test installer selection
        run: |
          python3 scripts/install.py --list
          python3 scripts/install.py --agent generic --tier core --dry-run
